
name: Build OmniStudioFX APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -q OmniStudioFX-cloud-build.zip -d "$RUNNER_TEMP/source"
          test -d "$RUNNER_TEMP/source/OmniStudioFX/app"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36-ext1" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        working-directory: ${{ runner.temp }}/source/OmniStudioFX
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniStudioFX-debug-apk
          path: ${{ runner.temp }}/source/OmniStudioFX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
