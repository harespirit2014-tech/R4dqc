name: Build OmniStudioFX APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          rm -rf "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q OmniStudioFX-cloud-build.zip -d "$RUNNER_TEMP/source"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36-ext1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Locate project
        id: locate
        run: |
          if [ -f "$RUNNER_TEMP/source/gradlew" ]; then
            echo "dir=$RUNNER_TEMP/source" >> "$GITHUB_OUTPUT"
          elif [ -f "$RUNNER_TEMP/source/OmniStudioFX/gradlew" ]; then
            echo "dir=$RUNNER_TEMP/source/OmniStudioFX" >> "$GITHUB_OUTPUT"
          else
            project_dir=$(find "$RUNNER_TEMP/source" -type f -name gradlew -printf '%h\n' -quit)
            if [ -n "$project_dir" ]; then
              echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
            else
              echo "No Gradle wrapper was found in the extracted archive"
              find "$RUNNER_TEMP/source" -maxdepth 4 -type f | sort
              exit 1
            fi
          fi

      - name: Make Gradle executable
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniStudioFX-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
