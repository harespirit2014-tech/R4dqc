name: Build OmniStudioFX APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          rm -rf "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q OmniStudioFX-cloud-build.zip -d "$RUNNER_TEMP/source"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Locate project
        id: locate
        run: |
          project_dir=$(find "$RUNNER_TEMP/source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' -quit)
          if [ -z "$project_dir" ]; then
            echo "No Gradle settings file found in the extracted archive"
            find "$RUNNER_TEMP/source" -maxdepth 5 -type f | sort
            exit 1
          fi
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project at $project_dir"
          ls -la "$project_dir"

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          find . -type f -path '*/build/outputs/apk/*/*.apk' -exec cp '{}' "$RUNNER_TEMP/apk/" \;
          test -n "$(find "$RUNNER_TEMP/apk" -type f -name '*.apk' -print -quit)"
          ls -lh "$RUNNER_TEMP/apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniStudioFX-debug-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 14
